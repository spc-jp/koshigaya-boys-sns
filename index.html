                <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 space-y-1 text-xs">
                  <span className="font-bold">💡 お母さん安心ポイント：</span>
                  <p>相手チームへの敬意や、誤解を招きやすい言葉が入っていないか「安心チェック機能」が自動で教えてくれます。例文のままでも、文章を少し書き換えても自由に使えます。</p>
                </div>

              </div>
            )}
          </section>

          <div className="space-y-4 sm:space-y-6">

            {/* ステップ 1: 行事・出来事を選ぶ */}
            <section className="bg-white rounded-3xl p-5 shadow-sm border border-brand-creamDark/60">
              <div className="flex items-center gap-2.5 mb-3.5">
                <span className="w-8 h-8 rounded-2xl bg-brand-red text-brand-cream font-extrabold text-sm flex items-center justify-center shrink-0 shadow-sm">
                  1
                </span>
                <div>
                  <h2 className="font-bold text-brand-textMain text-base">どんな出来事の投稿ですか？</h2>
                  <p className="text-xs text-brand-textMuted">当てはまるものを1つタップしてください</p>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {EVENTS.map(ev => {
                  const isSel = eventId === ev.id;
                  return (
                    <button
                      key={ev.id}
                      type="button"
                      onClick={() => setEventId(ev.id)}
                      className={`p-3.5 text-left rounded-2xl border-2 transition-all flex items-start gap-3 min-h-[64px] ${
                        isSel
                          ? 'border-brand-red bg-brand-cream/40 ring-2 ring-brand-red/20 text-brand-textMain font-bold'
                          : 'border-slate-100 bg-white hover:border-brand-creamDark hover:bg-slate-50 text-slate-700'
                      }`}
                    >
                      <span className="text-2xl shrink-0 mt-0.5">{ev.emoji}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-1 mb-0.5">
                          <span className="text-sm font-bold truncate">{ev.title}</span>
                          {isSel && <span className="text-xs text-brand-red font-bold shrink-0">● 選択中</span>}
                        </div>
                        <p className="text-xs text-brand-textMuted leading-tight">{ev.desc}</p>
                      </div>
                    </button>
                  );
                })}
              </div>
            </section>

            {/* ステップ 2: どこに投稿しますか？ */}
            <section className="bg-white rounded-3xl p-5 shadow-sm border border-brand-creamDark/60">
              <div className="flex items-center gap-2.5 mb-3.5">
                <span className="w-8 h-8 rounded-2xl bg-brand-red text-brand-cream font-extrabold text-sm flex items-center justify-center shrink-0 shadow-sm">
                  2
                </span>
                <div>
                  <h2 className="font-bold text-brand-textMain text-base">どこに投稿しますか？</h2>
                  <p className="text-xs text-brand-textMuted">ボタンを押すと文章の雰囲気が自動で切り替わります</p>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 sm:gap-3">
                <button
                  type="button"
                  onClick={() => {
                    setFormat('insta_feed');
                    setCustomMemo(currentEvent.templates.insta);
                  }}
                  className={`py-3 px-2 rounded-2xl border-2 text-center transition-all flex flex-col items-center justify-center gap-1 min-h-[82px] ${
                    format === 'insta_feed'
                      ? 'border-brand-red bg-brand-cream/50 text-brand-red font-bold ring-2 ring-brand-red/20'
                      : 'border-slate-100 bg-white text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <span className="text-2xl">📸</span>
                  <span className="text-xs sm:text-sm font-bold">Instagram</span>
                  <span className="text-[11px] text-brand-textMuted">写真・普段の様子</span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setFormat('insta_reel');
                    setCustomMemo(currentEvent.templates.insta);
                  }}
                  className={`py-3 px-2 rounded-2xl border-2 text-center transition-all flex flex-col items-center justify-center gap-1 min-h-[82px] ${
                    format === 'insta_reel'
                      ? 'border-brand-red bg-brand-cream/50 text-brand-red font-bold ring-2 ring-brand-red/20'
                      : 'border-slate-100 bg-white text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <span className="text-2xl">🎬</span>
                  <span className="text-xs sm:text-sm font-bold">リール動画</span>
                  <span className="text-[11px] text-brand-textMuted">ショート動画用</span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setFormat('facebook');
                    setCustomMemo(currentEvent.templates.facebook);
                  }}
                  className={`py-3 px-2 rounded-2xl border-2 text-center transition-all flex flex-col items-center justify-center gap-1 min-h-[82px] ${
                    format === 'facebook'
                      ? 'border-brand-red bg-brand-cream/50 text-brand-red font-bold ring-2 ring-brand-red/20'
                      : 'border-slate-100 bg-white text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <span className="text-2xl">📘</span>
                  <span className="text-xs sm:text-sm font-bold">Facebook</span>
                  <span className="text-[11px] text-brand-textMuted">丁寧な活動報告</span>
                </button>
              </div>

              {/* 🌟 選手紹介を選んだときの入力アシスタント */}
              {eventId === 'player_card' && (
                <div className="mt-4 p-4 bg-brand-cream/40 rounded-2xl border border-brand-creamDark space-y-3 fade-in">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-xs sm:text-sm text-brand-red flex items-center gap-1.5">
                      <span>🌟</span> 選手カードの項目を簡単入力（文章にすぐ反映されます）
                    </span>
                    <button
                      type="button"
                      onClick={applyTemplate}
                      className="text-xs bg-brand-red text-white px-2.5 py-1 rounded-xl font-bold shadow-sm"
                    >
                      文章に反映
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                    <div>
                      <label className="block text-brand-textMuted mb-1 font-semibold">選手のお名前</label>
                      <input
                        type="text"
                        value={playerData.name}
                        onChange={e => updatePlayerAndText('name', e.target.value)}
                        placeholder="例：山田 太郎"
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-brand-textMuted mb-1 font-semibold">学年</label>
                      <select
                        value={playerData.grade}
                        onChange={e => updatePlayerAndText('grade', e.target.value)}
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none"
                      >
                        <option value="中学1年">中学1年（新入団生）</option>
                        <option value="中学2年">中学2年（先輩）</option>
                        <option value="中学3年">中学3年（最高学年）</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-brand-textMuted mb-1 font-semibold text-brand-red">
                        ★ 出身学童野球チーム名（一番刺さります！）
                      </label>
                      <input
                        type="text"
                        value={playerData.originTeam}
                        onChange={e => updatePlayerAndText('originTeam', e.target.value)}
                        placeholder="例：越谷ライオンズ、〇〇少年野球"
                        className="w-full p-2 bg-white border-2 border-brand-red/40 rounded-xl outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-brand-textMuted mb-1 font-semibold">守備位置・ポジション</label>
                      <input
                        type="text"
                        value={playerData.position}
                        onChange={e => updatePlayerAndText('position', e.target.value)}
                        placeholder="例：キャッチャー、右投左打"
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block text-brand-textMuted mb-1 font-semibold">
                        後輩小学生への一言メッセージ（等身大のアドバイス）
                      </label>
                      <input
                        type="text"
                        value={playerData.comment}
                        onChange={e => updatePlayerAndText('comment', e.target.value)}
                        placeholder="例：すぐ慣れるから心配いらないよ！まずはキャッチボールしに来てね！"
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl outline-none"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* 🤝 学童チーム歓迎を選んだときの入力アシスタント */}
              {eventId === 'welcome_kids' && (
                <div className="mt-4 p-3.5 bg-brand-cream/40 rounded-2xl border border-brand-creamDark space-y-2 fade-in">
                  <label className="block text-xs font-bold text-brand-red">
                    🤝 来てくれた少年野球チームの名前
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={visitingTeam}
                      onChange={e => setVisitingTeam(e.target.value)}
                      placeholder="例：〇〇少年野球、〇〇ライオンズ"
                      className="flex-1 p-2 bg-white border border-slate-200 rounded-xl outline-none text-xs"
                    />
                    <button
                      type="button"
                      onClick={applyTemplate}
                      className="text-xs bg-brand-red text-white px-3 py-1.5 rounded-xl font-bold shrink-0"
                    >
                      文章に反映
                    </button>
                  </div>
                </div>
              )}

              {/* 試合結果を選んだときのスコア入力お手伝い */}
              {eventId === 'tournament' && (
                <div className="mt-4 pt-3 border-t border-brand-cream">
                  <button
                    type="button"
                    onClick={() => setShowScoreInput(!showScoreInput)}
                    className="text-xs sm:text-sm font-bold text-brand-red hover:underline flex items-center gap-1.5"
                  >
                    <span>{showScoreInput ? '▲ 試合スコア入力を閉じる' : '▼ 試合のスコア・対戦校を簡単に入れる（任意）'}</span>
                  </button>

                  {showScoreInput && (
                    <div className="mt-3 p-3.5 bg-brand-cream/30 rounded-2xl border border-brand-creamDark space-y-2.5 text-xs">
                      <div>
                        <label className="block text-brand-textMuted mb-1 font-semibold">球場・グラウンド名</label>
                        <input
                          type="text"
                          placeholder="例：越谷市民球場"
                          value={matchDetail.stadium}
                          onChange={e => setMatchDetail({...matchDetail, stadium: e.target.value})}
                          className="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-brand-textMuted mb-1 font-semibold">対戦相手チーム</label>
                          <input
                            type="text"
                            placeholder="例：〇〇ボーイズ"
                            value={matchDetail.opponent}
                            onChange={e => setMatchDetail({...matchDetail, opponent: e.target.value})}
                            className="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-brand-textMuted mb-1 font-semibold">スコア（越谷 - 相手）</label>
                          <div className="flex items-center gap-1.5">
                            <input
                              type="text"
                              placeholder="7"
                              value={matchDetail.myScore}
                              onChange={e => setMatchDetail({...matchDetail, myScore: e.target.value})}
                              className="w-1/2 p-2.5 text-center bg-white border border-slate-200 rounded-xl outline-none font-bold"
                            />
                            <span className="font-bold text-slate-400">-</span>
                            <input
                              type="text"
                              placeholder="3"
                              value={matchDetail.opScore}
                              onChange={e => setMatchDetail({...matchDetail, opScore: e.target.value})}
                              className="w-1/2 p-2.5 text-center bg-white border border-slate-200 rounded-xl outline-none font-bold"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </section>

            {/* ステップ 3: 伝えたい想い・本文 */}
            <section className="bg-white rounded-3xl p-5 shadow-sm border border-brand-creamDark/60">
              <div className="flex items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2.5">
                  <span className="w-8 h-8 rounded-2xl bg-brand-red text-brand-cream font-extrabold text-sm flex items-center justify-center shrink-0 shadow-sm">
                    3
                  </span>
                  <div>
                    <h2 className="font-bold text-brand-textMain text-base">文章の確認・手直し</h2>
                    <p className="text-xs text-brand-textMuted">このままでOK！自由につけ足しても大丈夫です</p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => {
                    const isFb = format === 'facebook';
                    setCustomMemo(isFb ? currentEvent.templates.facebook : currentEvent.templates.insta);
                  }}
                  className="text-xs text-brand-red hover:underline font-semibold bg-brand-cream/60 px-2.5 py-1.5 rounded-xl shrink-0"
                >
                  文章をもとに戻す
                </button>
              </div>

              <textarea
                value={customMemo}
                onChange={e => setCustomMemo(e.target.value)}
                rows="6"
                placeholder="ここに文章が入ります。自由に書き換えて使えます。"
                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm leading-relaxed text-brand-textMain focus:bg-white focus:border-brand-red focus:ring-2 focus:ring-brand-red/20 outline-none transition"
              />

              {/* 安心チェック表示 */}
              {tipsDetected.length > 0 && (
                <div className="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-2xl text-xs space-y-1 fade-in">
                  <div className="font-bold text-amber-900 flex items-center gap-1.5">
                    <span>💡</span> やさしい表現のワンポイントアドバイス
                  </div>
                  {tipsDetected.map((tip, idx) => (
                    <p key={idx} className="text-slate-700 leading-relaxed">
                      「<strong>{tip.word}</strong>」が入っています → <span className="text-amber-800 font-semibold">{tip.tip}</span>
                    </p>
                  ))}
                </div>
              )}

              {/* お母さん安心マナーノート */}
              <div className="mt-3 flex items-start gap-3 text-xs text-brand-textMuted bg-brand-cream/30 p-3 rounded-2xl border border-brand-cream">
                <img
                  src={MASCOT_IMG_SRC}
                  onError={(e) => {
                    if (e.target.src.indexOf('MASCOT_FALLBACK') === -1) {
                      e.target.src = MASCOT_FALLBACK;
                    }
                  }}
                  alt="マスコット"
                  className="w-7 h-7 rounded-full bg-brand-cream p-0.5 shadow-sm shrink-0 mt-0.5 object-cover"
                />
                <span className="leading-relaxed">
                  <strong>写真のワンポイント：</strong>相手チームの選手や、他の小学生の顔・ネームプレートが大きく写っている時は、スタンプ等で少し隠してあげると安心です。
                </span>
              </div>
            </section>

            {/* ステップ 4: 投稿の目的（最後の案内） */}
            <section className="bg-white rounded-3xl p-5 shadow-sm border border-brand-creamDark/60">
              <div className="flex items-center gap-2.5 mb-3.5">
                <span className="w-8 h-8 rounded-2xl bg-brand-red text-brand-cream font-extrabold text-sm flex items-center justify-center shrink-0 shadow-sm">
                  4
                </span>
                <div>
                  <h2 className="font-bold text-brand-textMain text-base">最後に伝えたい一言（案内）</h2>
                  <p className="text-xs text-brand-textMuted">読んだ人にどんなアクションをしてほしいですか？</p>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {Object.keys(CTAS).map(k => {
                  const item = CTAS[k];
                  const isSel = purpose === k;
                  return (
                    <button
                      key={k}
                      type="button"
                      onClick={() => setPurpose(k)}
                      className={`p-3.5 text-left rounded-2xl border-2 transition-all flex items-start gap-3 min-h-[64px] ${
                        isSel
                          ? 'border-brand-red bg-brand-cream/40 ring-2 ring-brand-red/20 font-bold text-brand-textMain'
                          : 'border-slate-100 bg-white hover:border-brand-creamDark text-slate-700'
                      }`}
                    >
                      <span className="text-2xl shrink-0 mt-0.5">{item.icon}</span>
                      <div className="flex-1 min-w-0">
                        <div className="text-xs sm:text-sm font-bold leading-tight mb-0.5">{item.label}</div>
                        <div className="text-[11px] text-brand-textMuted leading-tight">{item.sub}</div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </section>

            {/* 選手カード選択時：SNS画像用カードプレビュー */}
            {eventId === 'player_card' && (
              <div className="bg-gradient-to-br from-brand-red to-brand-redDark text-white p-5 rounded-3xl shadow-md border-2 border-brand-cream space-y-3 fade-in">
                <div className="flex items-center justify-between text-xs border-b border-brand-cream/20 pb-2">
                  <span className="bg-brand-cream text-brand-red font-black px-2.5 py-0.5 rounded-full">
                    Instagram画像・ストーリーズ用カード
                  </span>
                  <span className="text-brand-cream/80 text-[11px]">※スクショして画像に使えます</span>
                </div>

                <div className="flex items-center gap-3">
                  <img
                    src={MASCOT_IMG_SRC}
                    onError={(e) => {
                      if (e.target.src.indexOf('MASCOT_FALLBACK') === -1) {
                        e.target.src = MASCOT_FALLBACK;
                      }
                    }}
                    alt="マスコット"
                    className="w-14 h-14 rounded-full bg-brand-cream p-1 shadow-md shrink-0 object-cover"
                  />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-lg font-black">{playerData.name || '選手名'}</span>
                      <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full">{playerData.grade}</span>
                    </div>
                    <div className="text-xs text-brand-cream mt-0.5 font-bold">
                      出身：{playerData.originTeam || '学童野球チーム名'}
                    </div>
                    <div className="text-xs text-brand-cream/90">
                      守備位置：{playerData.position || 'ポジション'}
                    </div>
                  </div>
                </div>

                <div className="bg-white/10 p-3 rounded-2xl border border-brand-cream/20 text-xs leading-relaxed text-brand-creamLight">
                  <span className="font-bold text-brand-cream">後輩へのメッセージ：</span><br />
                  「{playerData.comment || '一緒にキャッチボールしよう！'}」
                </div>
              </div>
            )}

            {/* 完成した投稿文プレビュー枠 */}
            <section className="bg-white rounded-3xl shadow-md border border-brand-creamDark overflow-hidden">
              <div className="bg-gradient-to-r from-brand-red to-brand-redDark text-white px-5 py-4 flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">
                    {format === 'facebook' ? '📘' : format === 'insta_reel' ? '🎬' : '📸'}
                  </span>
                  <div>
                    <h3 className="text-sm sm:text-base font-black">完成した投稿文</h3>
                    <p className="text-[11px] text-brand-cream">
                      {format === 'facebook' ? 'Facebook用（丁寧な報告調＋署名）' : 'Instagram用（親しみ＋ハッシュタグ付き）'}
                    </p>
                  </div>
                </div>

                {/* PC表示用コピーボタン */}
                <button
                  type="button"
                  onClick={() => doCopy(finalPostText)}
                  className={`hidden sm:flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow transition transform active:scale-95 ${
                    copied
                      ? 'bg-emerald-600 text-white ring-2 ring-emerald-300'
                      : 'bg-brand-cream text-brand-red hover:bg-white'
                  }`}
                >
                  <span>{copied ? '✓ コピー完了！' : '📋 本文をコピー'}</span>
                </button>
              </div>

              <div className="p-4 sm:p-5">
                <pre className="whitespace-pre-wrap text-sm sm:text-base leading-relaxed text-brand-textMain font-sans bg-brand-creamLight p-4 rounded-2xl border border-brand-cream max-h-[460px] overflow-y-auto select-all">
                  {finalPostText}
                </pre>

                <div className="mt-3 flex items-center justify-between text-xs text-brand-textMuted px-1">
                  <span>文字数：約 {finalPostText.length} 文字</span>
                  <button
                    type="button"
                    onClick={() => doCopy(finalPostText)}
                    className="text-brand-red font-bold underline"
                  >
                    もう一度コピーする
                  </button>
                </div>
              </div>
            </section>

          </div>

          {/* スマホ用：画面下に固定される大きなコピーボタン */}
          <div className="sm:hidden fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur-md border-t border-brand-creamDark shadow-2xl z-50">
            <div className="max-w-3xl mx-auto flex items-center gap-2">
              <button
                type="button"
                onClick={() => doCopy(finalPostText)}
                className={`w-full py-3.5 px-4 rounded-2xl font-black text-base shadow-md flex items-center justify-center gap-2 transition transform active:scale-95 ${
                  copied
                    ? 'bg-emerald-600 text-white'
                    : 'bg-brand-red text-white hover:bg-brand-redDark'
                }`}
              >
                <span className="text-lg">{copied ? '✓' : '📋'}</span>
                <span>{copied ? 'コピーできました！アプリに貼るだけ' : '本文をコピーする（SNSに貼るだけ）'}</span>
              </button>
            </div>
          </div>

          {/* フッター */}
          <footer className="mt-12 text-center text-xs text-brand-textMuted py-4 border-t border-brand-creamDark/60 space-y-1.5">
            <p className="font-bold text-brand-textMain">
              越谷ボーイズ 広報サポート ／ 考えるを、ひとりにしない。
            </p>
            <p className="text-[11px] text-brand-textMuted">
              © NPO法人 越谷K・クラブ（越谷ボーイズ） SNS投稿メーカー
            </p>
          </footer>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
