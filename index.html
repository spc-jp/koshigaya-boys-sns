      inset: 0;

        115deg,
        transparent 0%,
        rgba(255, 0, 150, 0.25) 25%,
        rgba(0, 255, 255, 0.4) 45%,
        rgba(255, 255, 0, 0.35) 60%,
        rgba(0, 255, 128, 0.3) 75%,

      );

      transition: background-position 0.1s ease-out, opacity 0.3s;
    }
    .holo-sparkle {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 1.5px, transparent 2px),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,0.9) 2px, transparent 3px),
        radial-gradient(circle at 40% 70%, rgba(255,255,255,0.7) 1px, transparent 2px),

      background-size: 120px 120px;
      mix-blend-mode: overlay;

    }
    @keyframes holoAnim {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }

    .holo-auto-sheen {

<body class="min-h-screen pb-36 sm:pb-24">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // ローカルストレージ自動保存キー
    const STORAGE_KEY = 'kb_sns_draft_v2';

    // チームKB公式ロゴ画像（GitHubトップの team-logo.png を参照）
    const PRIMARY_TEAM_LOGO = "team-logo.png?v=20261103";
    const SECONDARY_TEAM_LOGO = "favicon.png?v=20261103";

    // 体験案内固定URL & 理念URL & スポンサー企業URL
    const ENTRY_URL = "https://www.koshigayaboys.com/entry/";
    const ABOUT_URL = "https://www.koshigayaboys.com/about/";
    const SPC_URL = "https://www.smileplusctg.com/";
    const PRIMARY_SPC_LOGO = "spc-logo.png?v=2026";
    const FALLBACK_SPC_LOGO = "https://spc-jp.github.io/koshigaya-boys-sns/spc-logo.png?v=2026";

    // チーム選択肢
    const TEAMS = [
      { id: 'koshigaya', name: '越谷ボーイズ', enName: 'KOSHIGAYA BOYS' },
      { id: 'chuo', name: '越谷中央ボーイズ', enName: 'KOSHIGAYA CHUO BOYS' }
    ];

    // ① 天気・グラウンド状況ピッカーの選択肢
    const WEATHER_OPTIONS = [
      { id: 'sunny', label: '☀️ 青空・快晴', prefix: '抜けるような青空と心地よい野球日和のもと、' },
      { id: 'cloudy', label: '☁️ 涼風', prefix: '過ごしやすいグラウンドの涼風が吹き抜けるなか、' },
      { id: 'hot', label: '🏃‍♂️ 猛暑', prefix: 'グラウンドの熱気にも負けない気迫みなぎる空気のなか、' },
      { id: 'autumn', label: '🍂 爽やかな秋晴れ', prefix: '爽やかな秋風が駆け抜ける絶好の野球日和のもと、' },
      { id: 'muddy', label: '👟 泥んこ・粘り', prefix: '泥だらけになりながら全力で白球を追いかけるなか、' }
    ];

    // ③ 今日の名場面・感情タグピッカーの選択肢
    const EMOTION_TAGS = [
      { id: 'run', label: '⚾️ 魂の全力疾走', text: '一塁を駆け抜ける魂の全力疾走' },
      { id: 'defense', label: '🛡️ 鉄壁のファインプレー', text: '仲間を救う鉄壁のビッグプレー' },
      { id: 'homerun', label: '🚀 快音・強烈ヒット', text: '快音を響かせた目の覚める強烈な一打' },
      { id: 'voice', label: '🗣️ ベンチの声出し団結', text: 'ベンチもスタンドも一丸となった大きな声出し' },
      { id: 'bontji', label: '👟 道具磨き・凡事徹底', text: '脱いだ靴や道具を美しく整える凡事徹底の姿勢' },
      { id: 'cheer', label: '📣 父母スタンドの熱い応援', text: '父母スタンドからの惜しみない温かい大声援' }
    ];

    // 行事マスター
    const EVENTS = [
      {
        id: 'tournament',
        title: '🏆 大会・公式戦の試合結果',
        badge: '試合速報',
        desc: '粘りの好ゲーム・全員野球の熱いドラマと応援への御礼'
      },
      {
        id: 'player',
        title: '🌟 今週のキラリ選手紹介',
        badge: '一番人気！',
        desc: '写真1枚でプロ野球カード画像＆紹介文を同時に作成できます'
      },
      {
        id: 'practice',
        title: '👟 普段の練習風景（凡事徹底）',
        badge: 'チーム方針',
        desc: '大きな挨拶・道具磨き・全力疾走・高校へつなぐ基礎指導'
      },
      {
        id: 'experience',
        title: '⚾️ 体験練習会・見学のご案内',
        badge: '新入団・小6向け',
        desc: '手ぶらOK・道具貸出あり・温かく迎える安心メッセージ'
      },
      {
        id: 'welcome_team',
        title: '🤝 学童チーム歓迎・体験の御礼',
        badge: '地域との絆',
        desc: '見学に来てくれた少年野球チームへの温かい感謝メッセージ'
      },
      {
        id: 'daily_schedule',
        title: '⏰ ある週末の1日（スケジュール）',
        badge: '父母さん安心',
        desc: '土日の時間割やお茶当番の負担軽減を伝えて不安を解消'
      },
      {
        id: 'summer_camp',
        title: '☀️ 夏季強化合宿のご報告',
        badge: '絆・成長',
        desc: '早朝練習から夜のミーティング・仲間と乗り越えた団結力'
      },
      {
        id: 'parents',
        title: '👨‍👩‍👦 父母会・サポート体制',
        badge: '協力体制',
        desc: '無理のない当番体制・指導者との連携・温かい応援の様子'
      },
      {
        id: 'sponsor',
        title: '🤝 オフィシャルスポンサー募集',
        badge: '創部30期・地域応援',
        desc: '30期・3,600名の絆とともに青少年の健全育成を支える企業・サポーター募集'
      }
    ];

    // 安心チェック用
    const NG_WORDS = [
      { word: '絶対に勝つ', advice: '「全力で挑む」「一戦必勝で立ち向かう」等の前向きな言葉が好印象です' },
      { word: '下手', advice: '「伸び代がある」「課題に真摯に向き合う」と言い換えると温かさが伝わります' },
      { word: 'ミスばかり', advice: '「反省を次の糧に」「修正を重ねて」と表現すると前向きになります' },
      { word: '相手のエラー', advice: '相手チームへの敬意を大切にするため、相手の失策への言及は控えましょう' }
    ];

    const App = () => {
      // チーム選択ステート
      const [teamKey, setTeamKey] = useState('koshigaya');
      const selectedTeam = TEAMS.find(t => t.id === teamKey) || TEAMS[0];
      const teamName = selectedTeam.name;
      const teamEnName = selectedTeam.enName;

      const [eventId, setEventId] = useState('tournament');
      const [format, setFormat] = useState('insta_feed');
      const [purpose, setPurpose] = useState('experience');
      const [showGuide, setShowGuide] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [copiedKey, setCopiedKey] = useState('');
      const [showPostCopyModal, setShowPostCopyModal] = useState(false);

      // ① 天気・情景ステート
      const [weatherId, setWeatherId] = useState('sunny');

      // ③ 名場面・感情タグステート（複数選択可能）
      const [selectedTags, setSelectedTags] = useState(['run', 'voice']);

      // 選手カード専用ステート
      const [cardTheme, setCardTheme] = useState('holo'); // デフォルトを虹色ホログラムに
      const [number, setNumber] = useState('10');
      const [nameJa, setNameJa] = useState('佐藤 颯太');
      const [nameEn, setNameEn] = useState('SOUTA SATO');
      const [position, setPosition] = useState('投手・外野手');
      const [handedness, setHandedness] = useState('右投左打');
      const [grade, setGrade] = useState('中学2年');
      const [originTeam, setOriginTeam] = useState('越谷ライオンズ出身');
      const [playerMessage, setPlayerMessage] = useState('僕も小6の秋は硬式球にドキドキしたけど、先輩たちが優しく教えてくれてすぐ慣れました！まずは気軽にキャッチボールしに来てください！');
      
      // ④ 写真の位置・サイズ調整スライダーステート
      const [imgScale, setImgScale] = useState(100); // 80% 〜 180%
      const [imgOffsetY, setImgOffsetY] = useState(0); // -150px 〜 +150px
      const [uploadedImgUrl, setUploadedImgUrl] = useState(null);
      const [isCardSaving, setIsCardSaving] = useState(false);
      const canvasRef = useRef(null);

      // 🌈 ホログラム傾きジャイロ・マウス追従ステート
      const [holoPos, setHoloPos] = useState({ x: 50, y: 50 });

      // 公式戦・試合結果 専用ステート
      const [tournamentName, setTournamentName] = useState('第〇回 日本少年野球 支部予選');
      const [stadiumName, setStadiumName] = useState('越谷市民球場');
      const [opponentName, setOpponentName] = useState('草加ボーイズ');
      const [myScore, setMyScore] = useState('6');
      const [opponentScore, setOpponentScore] = useState('4');
      const [matchMood, setMatchMood] = useState('win');
      const [matchHighlight, setMatchHighlight] = useState('最終回の満塁のピンチを、全員の気迫と好守備で守り抜きました！');

      // 自由入力・本文ステート
      const [customMemo, setCustomMemo] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      // スマホ傾き（ジャイロ）イベント検知
      useEffect(() => {
        const handleOrientation = (e) => {
          if (cardTheme !== 'holo') return;
          const gamma = e.gamma || 0; // -90 〜 +90 (左右傾き)
          const beta = e.beta || 0;   // -180 〜 +180 (前後傾き)
          const posX = Math.min(100, Math.max(0, ((gamma + 30) / 60) * 100));
          const posY = Math.min(100, Math.max(0, ((beta - 20) / 60) * 100));
          setHoloPos({ x: posX, y: posY });
        };

        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
        return () => {
          if (window.DeviceOrientationEvent) {
            window.removeEventListener('deviceorientation', handleOrientation, true);
          }
        };
      }, [cardTheme]);

      // 指やマウスのドラッグ・移動でホログラム光彩を操作
      const handleCardMove = (e) => {
        if (cardTheme !== 'holo') return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = ((clientX - rect.left) / rect.width) * 100;
        const y = ((clientY - rect.top) / rect.height) * 100;
        setHoloPos({ x, y });
      };

      // ② 下書き自動復元
      useEffect(() => {
        try {
          const savedDraft = localStorage.getItem(STORAGE_KEY);
          if (savedDraft) {
            const data = JSON.parse(savedDraft);
            if (data.teamKey) setTeamKey(data.teamKey);
            if (data.eventId) setEventId(data.eventId);
            if (data.format) setFormat(data.format);
            if (data.purpose) setPurpose(data.purpose);
            if (data.weatherId) setWeatherId(data.weatherId);
            if (data.selectedTags) setSelectedTags(data.selectedTags);
            if (data.cardTheme) setCardTheme(data.cardTheme);
            if (data.number) setNumber(data.number);
            if (data.nameJa) setNameJa(data.nameJa);
            if (data.nameEn) setNameEn(data.nameEn);
            if (data.position) setPosition(data.position);
            if (data.handedness) setHandedness(data.handedness);
            if (data.grade) setGrade(data.grade);
            if (data.originTeam) setOriginTeam(data.originTeam);
            if (data.playerMessage) setPlayerMessage(data.playerMessage);
            if (data.tournamentName) setTournamentName(data.tournamentName);
            if (data.stadiumName) setStadiumName(data.stadiumName);
            if (data.opponentName) setOpponentName(data.opponentName);
            if (data.myScore) setMyScore(data.myScore);
            if (data.opponentScore) setOpponentScore(data.opponentScore);
            if (data.matchMood) setMatchMood(data.matchMood);
            if (data.matchHighlight) setMatchHighlight(data.matchHighlight);
            if (data.imgScale) setImgScale(data.imgScale);
            if (data.imgOffsetY) setImgOffsetY(data.imgOffsetY);
          }
        } catch (e) {
          console.error("Failed to load draft:", e);
        }
      }, []);

      // ② 下書き自動保存
      useEffect(() => {
        try {
          const draft = {
            teamKey, eventId, format, purpose, weatherId, selectedTags, cardTheme,
            number, nameJa, nameEn, position, handedness, grade, originTeam, playerMessage,
            tournamentName, stadiumName, opponentName, myScore, opponentScore, matchMood, matchHighlight,
            imgScale, imgOffsetY
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
        } catch (e) {}
      }, [
        teamKey, eventId, format, purpose, weatherId, selectedTags, cardTheme,
        number, nameJa, nameEn, position, handedness, grade, originTeam, playerMessage,
        tournamentName, stadiumName, opponentName, myScore, opponentScore, matchMood, matchHighlight,
        imgScale, imgOffsetY
      ]);

      // 初回ダミー背景生成
      useEffect(() => {
        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 600;
        dummyCanvas.height = 900;
        const ctx = dummyCanvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 900);
        grad.addColorStop(0, '#506173');
        grad.addColorStop(0.5, '#6F8498');
        grad.addColorStop(1, '#344555');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 900);

        ctx.fillStyle = 'rgba(243, 232, 225, 0.25)';
        ctx.beginPath();
        ctx.arc(300, 370, 140, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#F3E8E1';
        ctx.font = '900 32px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚾️ 選手の写真を選んでください', 300, 350);

        ctx.font = 'bold 22px "Noto Sans JP", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('打撃・投球・ベンチの笑顔など', 300, 395);
        ctx.font = '18px "Noto Sans JP", sans-serif';
        ctx.fillStyle = 'rgba(243, 232, 225, 0.9)';
        ctx.fillText('下のスライダーで拡大や上下位置も合わせられます', 300, 435);

        setUploadedImgUrl(dummyCanvas.toDataURL());
      }, []);

      // ④ Canvasカード描画
      const renderCard = () => {
        if (!uploadedImgUrl) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = uploadedImgUrl;

        img.onload = () => {
          const W = 600;
          const H = 900;
          canvas.width = W;
          canvas.height = H;

          const THEME_COLORS = {
            holo: {
              main: '#1A0E2E',
              accent: '#E5C158',
              badgeBg: '#FFE600',
              badgeText: '#1A0E2E',
              subText: '#00F0FF',
              darkBand: 'rgba(15, 8, 30, 0.94)',
              titleBadge: '★ ULTRA RARE HOLOGRAM ★',
              isHolo: true
            },
            gold: {
              main: '#9B0709',
              accent: '#E5C158',
              badgeBg: '#E5C158',
              badgeText: '#1A1415',
              subText: '#FAF7F5',
              darkBand: 'rgba(20, 14, 15, 0.95)',
              titleBadge: '★ SPECIAL GOLD EDITION ★'
            },
            navy: {
              main: '#020562',
              accent: '#22AEC9',
              badgeBg: '#FFFFFF',
              badgeText: '#020562',
              subText: '#FFFFFF',
              darkBand: 'rgba(5, 8, 30, 0.95)',
              titleBadge: '★ ATHLETE NAVY EDITION ★'
            },
            classic: {
              main: '#BB5758',
              accent: '#F3E8E1',
              badgeBg: '#F3E8E1',
              badgeText: '#BB5758',
              subText: '#F3E8E1',
              darkBand: 'rgba(26, 20, 21, 0.95)',
              titleBadge: '★ CLASSIC EDITION ★'
            }
          };

          const theme = THEME_COLORS[cardTheme] || THEME_COLORS.holo;

          // 背景クリア
          ctx.fillStyle = '#1A1415';
          ctx.fillRect(0, 0, W, H);

          const baseRatio = Math.max(W / img.width, H / img.height);
          const zoomFactor = (imgScale || 100) / 100;
          const currentRatio = baseRatio * zoomFactor;

          const drawWidth = img.width * currentRatio;
          const drawHeight = img.height * currentRatio;

          const shiftX = (W - drawWidth) / 2;
          const shiftY = ((H - drawHeight) / 2) + (imgOffsetY || 0);

          ctx.drawImage(img, 0, 0, img.width, img.height, shiftX, shiftY, drawWidth, drawHeight);

          if (theme.isHolo) {
            ctx.save();
            ctx.globalCompositeOperation = 'color-dodge';
            const holoGrad = ctx.createLinearGradient(0, 0, W, H);
            holoGrad.addColorStop(0, 'rgba(255, 0, 128, 0.15)');
            holoGrad.addColorStop(0.25, 'rgba(0, 255, 255, 0.25)');
            holoGrad.addColorStop(0.5, 'rgba(255, 255, 0, 0.2)');
            holoGrad.addColorStop(0.75, 'rgba(0, 255, 128, 0.22)');
            holoGrad.addColorStop(1, 'rgba(255, 0, 200, 0.18)');
            ctx.fillStyle = holoGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            const stars = [
