  <script type="text/babel">

    // 目的・締めくくり（平易な言葉に翻訳）
    const CTAS = {
      experience: {
        label: '体験練習に来てほしい（公式HPへ案内）',
        sub: '「見学・体験はいつでも歓迎！」と結びます',
        icon: '📝',
        insta: '＼ 体験練習・見学はいつでも大歓迎です！ ／\n公式HPのWebフォーム、またはDMよりお気軽にお問い合わせください📩\n詳細はプロフィールのリンク（@koshigaya_boys）からご覧いただけます⚾️✨',
        fb: '【体験練習・見学のお問い合わせ】\n越谷ボーイズでは、新入団員（新中1・現小6）を随時募集しております。体験練習のご参加・ご質問は、下記公式ホームページのお問い合わせフォームよりお気軽にご連絡ください。\n🔗 公式サイト：https://koshigaya-boys.com/'
      },
      cheer: {

        insta: '選手たちのひたむきなプレーに、温かい「いいね！」やコメントでエールを届けていただけると大きな励みになります⚾️💬✨\nいつも応援ありがとうございます！',
        fb: '日頃より温かく見守ってくださる皆様の応援が、選手たちの最大の力となっております。引き続き越谷ボーイズへの温かいご声援をよろしくお願い申し上げます。'
      },
      thanks: {
        label: '感謝を伝えたい（指導者・保護者・大会関係者へ）',
        sub: '「皆様の温かい支えに感謝します」と結びます',
        icon: '🙏',
        insta: 'いつも温かく背中を押してくださる指導陣、保護者の皆様、そして地域の皆様に心から感謝いたします✨\nこれからも全員野球で恩返ししていきます！',
        fb: '大会を支えてくださる役員・審判員の皆様、日頃より惜しみない愛情を注いでくださる指導者・保護者の皆様に、改めて深く感謝申し上げます。'
      },
      ob_report: {
        label: 'OB・地域へ活動を報告したい（伝統の継承と信頼）',
        sub: '「先輩方、いつでもグラウンドへ！」と結びます',
        icon: '🤝',
        insta: '越谷ボーイズの伝統をしっかり引き継ぎ、後輩たちも全力で前進しています！OB・OGの先輩方、いつでもグランドへ遊びに来てください⚾️✨',
        fb: '越谷ボーイズの礎を築いてこられた歴代OB・OGの皆様、ならびに関係各位に謹んでご報告申し上げます。伝統の誇りを胸に、現役世代も全力で精進を続けてまいります。'
      }
    };

    // ハッシュタグ
    const TAGS_INSTA = '#越谷ボーイズ #中学硬式野球 #ボーイズリーグ #凡事徹底 #少年野球 #体験練習受付中 #越谷市 #高校野球へつなぐ #野球好きな人と繋がりたい';
    const TAGS_FB = '#越谷ボーイズ #ボーイズリーグ #中学硬式野球 #越谷Kクラブ #文武両道 #青少年健全育成';

    // 安心チェック用
    const NG_WORDS = [
      { word: '絶対に勝つ', advice: '「全力で挑む」「一戦必勝で立ち向かう」等の前向きな言葉が好印象です' },
      { word: '下手', advice: '「伸び代がある」「課題に真摯に向き合う」と言い換えると温かさが伝わります' },
      { word: 'ミスばかり', advice: '「反省を次の糧に」「修正を重ねて」と表現すると前向きになります' },
      { word: '相手のエラー', advice: '相手チームへの敬意を大切にするため、相手の失策への言及は控えましょう' }
    ];

    const App = () => {
      // 選択ステート（一番上の試合結果を初期選択）
      const [eventId, setEventId] = useState('tournament');
      const [format, setFormat] = useState('insta_feed');
      const [purpose, setPurpose] = useState('experience');
      const [showGuide, setShowGuide] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [copiedKey, setCopiedKey] = useState('');
      // ★ コピー後の次アクション案内ポップアップ
      const [showPostCopyModal, setShowPostCopyModal] = useState(false);

      // 選手カード専用ステート
      const [cardTheme, setCardTheme] = useState('gold'); // 'gold' | 'navy' | 'classic'
      const [number, setNumber] = useState('10');
      const [nameJa, setNameJa] = useState('佐藤 颯太');
      const [nameEn, setNameEn] = useState('SOUTA SATO');
      const [position, setPosition] = useState('投手・外野手');
      const [handedness, setHandedness] = useState('右投左打');
      const [grade, setGrade] = useState('中学2年');
      const [originTeam, setOriginTeam] = useState('越谷ライオンズ出身');
      const [playerMessage, setPlayerMessage] = useState('僕も小6の秋は硬式球にドキドキしたけど、先輩たちが優しく教えてくれてすぐ慣れました！まずは気軽にキャッチボールしに来てください！');
      
      // 画像アップロード & Canvas
      const [uploadedImgUrl, setUploadedImgUrl] = useState(null);
      const [isCardSaving, setIsCardSaving] = useState(false);
      const [mascotImgObj, setMascotImgObj] = useState(null);
      const canvasRef = useRef(null);

      // ★ 公式戦・試合結果 専用ステート
      const [tournamentName, setTournamentName] = useState('第〇回 日本少年野球 支部予選');
      const [stadiumName, setStadiumName] = useState('越谷市民球場');
      const [opponentName, setOpponentName] = useState('草加ボーイズ');
      const [myScore, setMyScore] = useState('6');
      const [opponentScore, setOpponentScore] = useState('4');
      const [matchMood, setMatchMood] = useState('win'); // 'win' | 'good' | 'lose'
      const [matchHighlight, setMatchHighlight] = useState('最終回の満塁のピンチを、全員の気迫と好守備で守り抜きました！');

      // 自由入力・本文ステート
      const [customMemo, setCustomMemo] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      // マスコット画像の事前ロード（カード描画用）
      useEffect(() => {
        const mImg = new Image();
        mImg.crossOrigin = "anonymous";
        mImg.onload = () => setMascotImgObj(mImg);
        mImg.onerror = () => {
          // フォールバックURLから再読込
          mImg.src = FALLBACK_MASCOT_URL;
        };
        mImg.src = PRIMARY_MASCOT_URL;
      }, []);

      // 初回ダミー写真背景の生成
      useEffect(() => {
        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 600;
        dummyCanvas.height = 900;
        const ctx = dummyCanvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 900);
        grad.addColorStop(0, '#506173');
        grad.addColorStop(0.5, '#6F8498');
        grad.addColorStop(1, '#344555');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 900);

        ctx.fillStyle = 'rgba(243, 232, 225, 0.25)';
        ctx.beginPath();
        ctx.arc(300, 370, 140, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#F3E8E1';
        ctx.font = '900 32px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚾️ 選手の写真を選んでください', 300, 350);

        ctx.font = 'bold 22px "Noto Sans JP", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('打撃・投球・ベンチの笑顔など', 300, 395);
        ctx.font = '18px "Noto Sans JP", sans-serif';
        ctx.fillStyle = 'rgba(243, 232, 225, 0.9)';
        ctx.fillText('スマホで撮った縦向き写真がキレイに収まります', 300, 435);

        setUploadedImgUrl(dummyCanvas.toDataURL());
      }, []);

      // Canvasにカルビー風野球カードフレームを描画
      const renderCard = () => {
        if (!uploadedImgUrl) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = uploadedImgUrl;

        img.onload = () => {
          const W = 600;
          const H = 900;
          canvas.width = W;
          canvas.height = H;

          // テーマごとの配色定義
          const THEME_COLORS = {
            gold: {
              main: '#9B0709',       // 越谷深紅
              accent: '#E5C158',     // シャンパンゴールド
              accentBorder: '#D4AF37',
              badgeBg: '#E5C158',
              badgeText: '#1A1415',
              subText: '#FAF7F5',
              darkBand: 'rgba(20, 14, 15, 0.95)',
              titleBadge: '★ SPECIAL GOLD EDITION ★'
            },
            navy: {
              main: '#020562',       // 侍ネイビー
              accent: '#22AEC9',     // スポーティシアン
              accentBorder: '#00E5FF',
              badgeBg: '#FFFFFF',
              badgeText: '#020562',
              subText: '#FFFFFF',
              darkBand: 'rgba(5, 8, 30, 0.95)',
              titleBadge: '★ ATHLETE NAVY EDITION ★'
            },
            classic: {
              main: '#BB5758',       // クラシックローズ
              accent: '#F3E8E1',     // 生成りクリーム
              accentBorder: '#FFFFFF',
              badgeBg: '#F3E8E1',
              badgeText: '#BB5758',
              subText: '#F3E8E1',
              darkBand: 'rgba(26, 20, 21, 0.95)',
              titleBadge: '★ CLASSIC EDITION ★'
            }
          };

          const theme = THEME_COLORS[cardTheme] || THEME_COLORS.gold;

          // 1. 写真トリミング中央全画面フィット
          const hRatio = W / img.width;
          const vRatio = H / img.height;
          const ratio = Math.max(hRatio, vRatio);
          const shiftX = (W - img.width * ratio) / 2;
          const shiftY = (H - img.height * ratio) / 2;
          ctx.drawImage(img, 0, 0, img.width, img.height, shiftX, shiftY, img.width * ratio, img.height * ratio);

          // 2. 左上：鋭角トライアングルバナー
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(290, 0);
          ctx.lineTo(0, 195);
          ctx.closePath();
          ctx.fillStyle = theme.main;
          ctx.fill();

          // 左上ゴールド/アクセント装飾ダブルライン
          ctx.beginPath();
          ctx.moveTo(290, 0);
          ctx.lineTo(304, 0);
          ctx.lineTo(0, 205);
          ctx.lineTo(0, 195);
          ctx.closePath();
          ctx.fillStyle = theme.accent;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(304, 0);
          ctx.lineTo(308, 0);
          ctx.lineTo(0, 208);
          ctx.lineTo(0, 205);
          ctx.closePath();
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          // 左上：シラコバト公式エンブレムの描画（カードに本物のプロ仕様感を演出）
          if (mascotImgObj) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(42, 54, 26, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = theme.accent;
            ctx.stroke();
            ctx.clip();
            ctx.drawImage(mascotImgObj, 16, 28, 52, 52);
            ctx.restore();
          }

          // 左上ロゴテキスト & スター刻印（エンブレムがある場合は位置を右に美しくオフセット）
          const textOffsetX = mascotImgObj ? 48 : 0;
          ctx.fillStyle = theme.subText;
          ctx.font = '900 21px "Noto Sans JP", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('KOSHIGAYA', 26 + textOffsetX, 44);
          ctx.font = 'bold 11px sans-serif';
          ctx.letterSpacing = '1.8px';
          ctx.fillText('BOYS BASEBALL CARD', 28 + textOffsetX, 62);

          // 箔押し風刻印バッジ
          ctx.fillStyle = theme.accent;
          ctx.font = 'bold 11px sans-serif';
          ctx.letterSpacing = '0.8px';
          ctx.fillText(theme.titleBadge, 26, 96);
          ctx.restore();

          // 3. 下部：カルビー風多層シャープカッティングフレーム
          const bottomBaseY = 620;

          // (A) サブカラーライン
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, bottomBaseY - 20);
          ctx.lineTo(W, bottomBaseY + 80);
          ctx.lineTo(W, bottomBaseY + 95);
          ctx.lineTo(0, bottomBaseY - 5);
          ctx.closePath();
          ctx.fillStyle = theme.accent;
          ctx.fill();
          ctx.restore();

          // (B) メインカラー鋭角フレーム
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, bottomBaseY);
          ctx.lineTo(W, bottomBaseY + 100);
          ctx.lineTo(W, H);
          ctx.lineTo(0, H);
          ctx.closePath();
          ctx.fillStyle = theme.main;
          ctx.fill();
          ctx.restore();

          // (C) 引き締めダーク帯
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, bottomBaseY + 75);
          ctx.lineTo(W, bottomBaseY + 128);
          ctx.lineTo(W, H);
          ctx.lineTo(0, H);
          ctx.closePath();
          ctx.fillStyle = theme.darkBand;
          ctx.fill();
          ctx.restore();

          // 4. テキスト情報
          ctx.save();
          // 背番号（ゴールドまたは白でシャープに描画）
          ctx.fillStyle = theme.accent;
          ctx.font = '78px "Black Ops One", "Teko", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(number || '00', 34, 765);

          // チーム名ラベル
          ctx.fillStyle = theme.subText;
          ctx.font = 'bold 12px sans-serif';
          ctx.letterSpacing = '2.5px';
          ctx.fillText('TEAM KOSHIGAYA BOYS', 36, 788);

          // 選手名（英字ステンシル）
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 44px "Teko", sans-serif';
          ctx.letterSpacing = '1.5px';
          ctx.fillText((nameEn || 'PLAYER NAME').toUpperCase(), 36, 832);

          // 選手名（漢字）
          ctx.fillStyle = theme.accent;
          ctx.font = '900 22px "Noto Sans JP", sans-serif';
          ctx.fillText(nameJa || '', 36, 866);

          // 学年・守備位置・投打（プロ名鑑スタイル）
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 13px "Noto Sans JP", sans-serif';
          const subInfo = [grade, position, handedness].filter(Boolean).join(' ｜ ');
          if (subInfo) {
            ctx.fillText(`[ ${subInfo} ]`, 185, 866);
          }

          // 5. 右下：出身学童チーム名バッジ（ゴールド額縁つき）
          if (originTeam) {
            const badgeW = 230;
            const badgeH = 36;
            const badgeX = W - badgeW - 20;
            const badgeY = H - 54;

            // 金フチ
            ctx.fillStyle = theme.accent;
            ctx.beginPath();
            ctx.roundRect(badgeX - 2, badgeY - 2, badgeW + 4, badgeH + 4, 8);
            ctx.fill();

            // バッジ本体
            ctx.fillStyle = theme.badgeBg;
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 6);
            ctx.fill();

              <div className="border-b border-stone-200 pb-3 mb-4">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🏆</span>
                    <h2 className="font-black text-cardMain text-base sm:text-lg">
                      公式戦・試合結果 かんたん入力シート
                    </h2>
                  </div>
                  <span className="bg-cardMain text-cardSub text-xs font-black px-2.5 py-1 rounded-full shrink-0 shadow-sm">
                    スコア連動
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-stone-600 mt-1">
                  枠をうめるだけで、InstagramとFacebook両方の完璧な速報文が自動完成します
                </p>
              </div>

              {/* 試合の雰囲気・勝敗をワンタップで選ぶボタン */}
              <div className="mb-4">
                <label className="block text-xs sm:text-sm font-black text-stone-800 mb-2 flex items-center gap-1.5">
                  <span>⚡️</span>
                  <span>どんな試合でしたか？（タップで文章が自動変化）</span>
                </label>
                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => setMatchMood('win')}
                    className={`py-2.5 px-2 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center gap-1 transition-all active:scale-95 ${
                      matchMood === 'win'
                        ? 'border-emerald-600 bg-emerald-50 text-emerald-950 ring-2 ring-emerald-400 shadow-md'
                        : 'border-stone-200 bg-white text-stone-600 hover:bg-stone-50'
                    }`}
                  >
                    <span className="text-lg">🎉</span>
                    <span>歓喜の勝利！</span>
                    <span className="text-[10px] text-emerald-700 font-bold">全員で掴んだ白星</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setMatchMood('good')}
                    className={`py-2.5 px-2 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center gap-1 transition-all active:scale-95 ${
                      matchMood === 'good'
                        ? 'border-blue-600 bg-blue-50 text-blue-950 ring-2 ring-blue-400 shadow-md'
                        : 'border-stone-200 bg-white text-stone-600 hover:bg-stone-50'
                    }`}
                  >
                    <span className="text-lg">🤝</span>
                    <span>全員の好ゲーム</span>
                    <span className="text-[10px] text-blue-700 font-bold">白熱の熱戦・引分</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setMatchMood('lose')}
                    className={`py-2.5 px-2 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center gap-1 transition-all active:scale-95 ${
                      matchMood === 'lose'
                        ? 'border-amber-600 bg-amber-50 text-amber-950 ring-2 ring-amber-400 shadow-md'
                        : 'border-stone-200 bg-white text-stone-600 hover:bg-stone-50'
                    }`}
                  >
                    <span className="text-lg">💪</span>
                    <span>惜敗・次へ前進</span>
                    <span className="text-[10px] text-amber-700 font-bold">悔しさをバネに</span>
                  </button>
                </div>
              </div>

              {/* 穴埋め入力フォーム */}
              <div className="bg-[#FAF7F5] p-4 rounded-2xl border border-stone-200 space-y-3.5">
                
                {/* 大会名 ＆ 試合会場 */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                  <div>
                    <label className="block font-bold text-stone-800 mb-1 text-xs sm:text-sm">
                      大会名
                    </label>
                    <input
                      type="text"
                      value={tournamentName}
                      onChange={e => setTournamentName(e.target.value)}
                      placeholder="例：第〇回 日本少年野球 支部予選"
                      className="w-full p-2.5 bg-white border border-stone-300 rounded-xl font-bold outline-none focus:border-cardMain"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-stone-800 mb-1 text-xs sm:text-sm">
                      試合会場（球場名）
                    </label>
                    <input
                      type="text"
                      value={stadiumName}
                      onChange={e => setStadiumName(e.target.value)}
                      placeholder="例：越谷市民球場"
                      className="w-full p-2.5 bg-white border border-stone-300 rounded-xl font-bold outline-none focus:border-cardMain"
                    />
                  </div>
                </div>

                {/* スコア・対戦相手（大きく見やすい専用ボード風） */}
                <div className="bg-white p-3.5 rounded-2xl border-2 border-stone-300">
                  <label className="block font-black text-stone-800 mb-2 text-xs sm:text-sm text-center">
                    ⚾️ 試合スコア・対戦カード
                  </label>
                  
                  <div className="flex items-center justify-between gap-2">
                    {/* 越谷ボーイズ */}
                    <div className="flex-1 text-center">
                      <div className="font-black text-cardMain text-xs sm:text-sm mb-1 truncate">
                        越谷ボーイズ
                      </div>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={myScore}
                        onChange={e => setMyScore(e.target.value)}
                        placeholder="6"
                        className="w-full max-w-[80px] mx-auto p-2 text-2xl sm:text-3xl font-black text-center bg-[#FAF7F5] border-2 border-cardMain rounded-xl outline-none"
                      />
                    </div>

                    <div className="text-xl sm:text-2xl font-black text-stone-400 px-1">
                      ー
                    </div>

                    {/* 対戦相手 */}
                    <div className="flex-1 text-center">
                      <div className="mb-1">
                        <input
                          type="text"
                          value={opponentName}
                          onChange={e => setOpponentName(e.target.value)}
                          placeholder="草加ボーイズ"
                          className="w-full p-1 text-xs sm:text-sm font-black text-center border-b border-stone-300 bg-transparent outline-none focus:border-cardMain truncate"
                        />
                      </div>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={opponentScore}
                        onChange={e => setOpponentScore(e.target.value)}
                        placeholder="4"
                        className="w-full max-w-[80px] mx-auto p-2 text-2xl sm:text-3xl font-black text-center bg-[#FAF7F5] border-2 border-stone-400 rounded-xl outline-none"
                      />
                    </div>
                  </div>
                </div>

                {/* 今日のハイライト・一言 */}
                <div className="text-sm">
                  <label className="block font-bold text-stone-800 mb-1 text-xs sm:text-sm flex items-center justify-between">
                    <span>💬 今日のハイライト・ナイスプレー（一言メモ）</span>
                    <span className="text-[11px] text-stone-500 font-normal">空欄でもOK</span>
                  </label>
                  <textarea
                    rows="2"
                    value={matchHighlight}
                    onChange={e => setMatchHighlight(e.target.value)}
                    placeholder="例：最終回の満塁のピンチを、全員の気迫と好守備で守り抜きました！"
                    className="w-full p-2.5 bg-white border border-stone-300 rounded-xl text-xs sm:text-sm leading-relaxed outline-none focus:border-cardMain"
                  />
                </div>
              </div>
            </section>
          )}

          {/* ステップ② 投稿フォーマットを選ぶ */}
          <section className="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-stone-200 mb-4">
            <div className="flex items-center gap-2.5 mb-3.5">
              <span className="w-7 h-7 rounded-full bg-cardMain text-cardSub text-sm font-black flex items-center justify-center shrink-0">
                2
              </span>
              <div>
                <h2 className="font-black text-stone-800 text-base">
                  どこに投稿しますか？
                </h2>
                <p className="text-xs text-stone-500">
                  投稿先に合わせて文章のトーンが自動で変わります
                </p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <button
                type="button"
                onClick={() => setFormat('insta_feed')}
                className={`p-3.5 text-left rounded-2xl border-2 flex items-center gap-3 transition-all active:scale-[0.99] ${
                  format === 'insta_feed'
                    ? 'border-cardMain bg-cardSub/40 text-cardMain font-black ring-2 ring-cardMain/30'
                    : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'
                }`}
              >
                <span className="text-2xl shrink-0">📸</span>
                <div className="min-w-0">
                  <div className="text-sm font-black">Instagram</div>
                  <div className="text-xs text-stone-500">写真・普段の様子</div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => setFormat('insta_reel')}
                className={`p-3.5 text-left rounded-2xl border-2 flex items-center gap-3 transition-all active:scale-[0.99] ${
                  format === 'insta_reel'
                    ? 'border-purple-600 bg-purple-50 text-purple-950 font-black ring-2 ring-purple-300'
                    : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'
                }`}
              >
                <span className="text-2xl shrink-0">🎬</span>
                <div className="min-w-0">
                  <div className="text-sm font-black">リール動画</div>
                  <div className="text-xs text-stone-500">ショート動画用</div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => setFormat('facebook')}
                className={`p-3.5 text-left rounded-2xl border-2 flex items-center gap-3 transition-all active:scale-[0.99] ${
                  format === 'facebook'
                    ? 'border-blue-600 bg-blue-50 text-blue-950 font-black ring-2 ring-blue-300'
                    : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'
                }`}
              >
                <span className="text-2xl shrink-0">📘</span>
                <div className="min-w-0">
                  <div className="text-sm font-black">Facebook</div>
                  <div className="text-xs text-stone-500">OB・丁寧な活動報告</div>
                </div>
              </button>
            </div>
          </section>

          {/* ステップ③ 伝えたい想い・本文の確認（編集可能） */}
          <section className="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-stone-200 mb-4">
            <div className="flex items-center justify-between border-b border-stone-100 pb-2 mb-2.5">
              <div className="flex items-center gap-2.5">
                <span className="w-7 h-7 rounded-full bg-cardMain text-cardSub text-sm font-black flex items-center justify-center shrink-0">
                  3
                </span>
                <div>
                  <h2 className="font-black text-stone-800 text-base">
                    本文の確認・編集
                  </h2>
                  <p className="text-xs text-stone-500">
                    このままでもOK、気になる言葉は自由に書き直せます
                  </p>
                </div>
              </div>
            </div>

            <textarea
              rows="7"
              value={customMemo}
              onChange={e => setCustomMemo(e.target.value)}
              placeholder="ここに投稿文が入ります（1行メモでも構いません）"
              className="w-full p-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-sm sm:text-base leading-relaxed text-stone-800 outline-none focus:bg-white focus:border-cardMain transition"
            />

            {/* 安心チェック機能（アラート） */}
            {ngHits.length > 0 && (
              <div className="mt-2.5 p-3.5 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-xs sm:text-sm space-y-1 fade-in">
                <div className="font-bold flex items-center gap-1.5 text-amber-800">
                  <span>⚠️</span>
                  <span>安心チェック：表現の配慮ポイント</span>
                </div>
                {ngHits.map((h, i) => (
                  <p key={i} className="text-stone-700">
                    「<strong>{h.word}</strong>」が含まれています → <span className="text-amber-800 font-bold">{h.advice}</span>
                  </p>
                ))}
              </div>
            )}
          </section>

          {/* ステップ④ 最後の案内（CTA） */}
          <section className="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-stone-200 mb-4">
            <div className="flex items-center gap-2.5 mb-3.5">
              <span className="w-7 h-7 rounded-full bg-cardMain text-cardSub text-sm font-black flex items-center justify-center shrink-0">
                4
              </span>
              <div>
                <h2 className="font-black text-stone-800 text-base">
                  最後の案内（どうしてほしい？）
                </h2>
                <p className="text-xs text-stone-500">
                  文章の最後の締めくくりを選びます
                </p>
              </div>
            </div>

            <div className="grid grid-cols-1 gap-2.5">
              {Object.keys(CTAS).map(k => {
                const c = CTAS[k];
                const isSelected = purpose === k;
                return (
                  <button
                    key={k}
                    type="button"
                    onClick={() => setPurpose(k)}
                    className={`p-3.5 text-left rounded-2xl border-2 flex items-start gap-3 transition-all active:scale-[0.99] ${
                      isSelected
                        ? 'border-cardMain bg-cardSub/40 text-cardMain ring-2 ring-cardMain/30'
                        : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'
                    }`}
                  >
                    <span className="text-xl shrink-0 mt-0.5">{c.icon}</span>
                    <div className="min-w-0">
                      <div className={`text-sm sm:text-base font-black ${isSelected ? 'text-cardMain' : 'text-stone-800'}`}>
                        {c.label}
                      </div>
                      <div className="text-xs text-stone-500 mt-0.5">
                        {c.sub}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </section>

          {/* 完成した投稿文プレビュー ＆ コピー */}
          <section className="bg-white rounded-3xl p-4 sm:p-5 shadow-md border border-stone-200 mb-6">
            <div className="flex items-center justify-between border-b border-stone-100 pb-3 mb-3">
              <div className="flex items-center gap-2">
                <span className="text-lg">
                  {format === 'facebook' ? '📘' : format === 'insta_reel' ? '🎬' : '📸'}
                </span>
                <div>
                  <h3 className="font-black text-stone-800 text-sm sm:text-base">
                    完成した文章（これを貼り付けます）
                  </h3>
                  <p className="text-xs text-stone-500">
                    ハッシュタグや公式サイトへの案内も自動で入っています
                  </p>
                </div>
              </div>

              <button
                type="button"
                onClick={() => copyToClipboard('preview')}
                className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black text-white shadow-md active:scale-95 transition shrink-0 ${
                  copiedKey === 'preview' ? 'bg-emerald-600' : 'bg-cardMain hover:opacity-90'
                }`}
              >
                {copiedKey === 'preview' ? '✓ コピー完了！' : '本文をコピー'}
              </button>
            </div>

            <pre className="whitespace-pre-wrap text-xs sm:text-sm leading-relaxed text-stone-800 font-sans bg-[#FAF7F5] p-4 rounded-2xl border border-stone-200 select-all max-h-[380px] overflow-y-auto">
              {finalPostText}
            </pre>
          </section>

          {/* スマートフォン用：最下部固定コピーバー（安心の押しやすさ・セーフエリア対応） */}
          <div className="fixed bottom-0 left-0 right-0 p-3.5 pb-safe bg-white/95 backdrop-blur-md border-t border-stone-200 shadow-2xl z-40 sm:hidden">
            <div className="max-w-xl mx-auto flex items-center gap-2">
              <button
                type="button"
                onClick={() => copyToClipboard('bottom')}
                className={`flex-1 py-4 px-4 rounded-2xl text-base font-black text-cardSub shadow-lg active:scale-95 transition flex items-center justify-center gap-2 ${
                  copiedKey === 'bottom' ? 'bg-emerald-600' : 'bg-cardMain'
                }`}
              >
                <span className="text-lg">📋</span>
                <span>{copiedKey === 'bottom' ? '✓ コピー完了！SNSに貼るだけ' : '本文をコピーする（SNSに貼るだけ）'}</span>
              </button>
            </div>
          </div>

          {/* フッター */}
          <footer className="mt-8 text-center text-xs sm:text-sm text-stone-500 py-3 space-y-1">
            <p className="font-bold text-stone-700">
              越谷ボーイズ 広報サポート ／ 考えるを、ひとりにしない。
            </p>
            <p className="text-xs">
              © NPO法人 越谷K・クラブ（越谷ボーイズ）
            </p>
          </footer>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
