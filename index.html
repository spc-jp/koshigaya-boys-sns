      { word: '絶対に勝つ', tip: '「全力で挑む」「一戦必勝」など前向きな言葉に変えると安心です' },

      const [tipsDetected, setTipsDetected] = useState([]);

      const currentEvent = EVENTS.find(e => e.id === eventId) || EVENTS[0];

      useEffect(() => {
        const isFb = format === 'facebook';

      }, [eventId]);

      // 安心チェック
      useEffect(() => {
        const hits = [];
        CHECK_WORDS.forEach(c => {
          if (customMemo.includes(c.word)) {
            hits.push(c);
          }
        });
        setTipsDetected(hits);
